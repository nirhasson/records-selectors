# Every night: add fresh albums to data/pool.json and commit it. Vercel redeploys on the push.
name: Collect album pool

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: # allows a manual run from the Actions tab
    inputs:
      add:
        description: "How many new albums to add"
        default: "300"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect albums
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          ODESLI_API_KEY: ${{ secrets.ODESLI_API_KEY }} # optional
        run: node scripts/collect-pool.js --add ${{ github.event.inputs.add || 300 }}
      - name: Commit updated pool
        run: |
          git config user.name "waxriffle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pool.json
          git diff --cached --quiet || git commit -m "Update album pool"
          git push
