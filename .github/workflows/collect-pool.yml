# Every night: add fresh albums to data/pool.json, rebuild the public pages data and sitemap, and commit. Vercel redeploys on the push.
name: Collect album pool

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: # allows a manual run from the Actions tab
    inputs:
      add:
        description: "How many new albums to add"
        default: "300"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect albums
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          ODESLI_API_KEY: ${{ secrets.ODESLI_API_KEY }} # optional
        run: node scripts/collect-pool.js --add ${{ github.event.inputs.add || 300 }}
      - name: Build album, genre and radio pages and the sitemap
        run: node scripts/build-pages.js
      - name: Commit updated pool and pages
        run: |
          git config user.name "waxriffle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pool.json data/site sitemap.xml sitemaps robots.txt
          git diff --cached --quiet && exit 0
          git commit -m "Update album pool"
          # Someone may have pushed while this ran (the run takes ~30 minutes).
          # Replay on top of it; if the generated files conflict, keep tonight's pool
          # and rebuild the pages on the latest code instead.
          if ! git pull --rebase origin main; then
            git rebase --abort
            cp data/pool.json "$RUNNER_TEMP/pool.json"
            git reset --hard origin/main
            cp "$RUNNER_TEMP/pool.json" data/pool.json
            node scripts/build-pages.js
            git add data/pool.json data/site sitemap.xml sitemaps robots.txt
            git commit -m "Update album pool"
          fi
          git push origin HEAD:main
